services:

  # ─── PostgreSQL ────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: gymtrack_db
    environment:
      POSTGRES_DB: gymtrack_db
      POSTGRES_USER: gymtrack
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymtrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot Backend ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gymtrack_backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/gymtrack_db
      DB_USERNAME: gymtrack
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME manquant dans .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD manquant dans .env}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?ADMIN_DEFAULT_PASSWORD manquant dans .env}
      DEVICE_ACCESS_KEY: ${DEVICE_ACCESS_KEY:?DEVICE_ACCESS_KEY manquant dans .env}
      SPRING_PROFILES_ACTIVE: prod
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4200}
      JAVA_OPTS: "-Xmx512m"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # ─── Angular + nginx Frontend ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gymtrack_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: on-failure

volumes:
  postgres_data:
