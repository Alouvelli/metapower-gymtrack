<h2 mat-dialog-title>
  {{ edition ? 'Créneau de ' + data.gerant?.prenom + ' ' + data.gerant?.nom : 'Nouveau gérant' }}
</h2>

<form [formGroup]="form" (ngSubmit)="enregistrer()">
  <mat-dialog-content class="grid">

    <ng-container *ngIf="!edition">
      <mat-form-field appearance="outline">
        <mat-label>Prénom</mat-label>
        <input matInput formControlName="prenom" required>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Nom</mat-label>
        <input matInput formControlName="nom" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Identifiant</mat-label>
        <input matInput formControlName="username" autocomplete="off" required>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mot de passe</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="new-password" required>
        <mat-hint>8 caractères minimum</mat-hint>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Salle</mat-label>
        <mat-select formControlName="siteId" required>
          <mat-option *ngFor="let s of sites" [value]="s.id">{{ s.nom }}</mat-option>
        </mat-select>
      </mat-form-field>
    </ng-container>

    <mat-form-field appearance="outline">
      <mat-label>Heure de début</mat-label>
      <input matInput type="time" formControlName="heureDebut" required>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Heure de fin</mat-label>
      <input matInput type="time" formControlName="heureFin" required>
    </mat-form-field>

    <p class="erreur full" *ngIf="erreur">{{ erreur }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Annuler</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || enregistrement">
      Enregistrer
    </button>
  </mat-dialog-actions>
</form>
