<div class="login-page">
  <!-- Formes décoratives flottantes -->
  <div class="bg-shape s1"></div>
  <div class="bg-shape s2"></div>
  <div class="bg-shape s3"></div>

  <div class="login-card glass">
    <div class="brand">
      <div class="brand-logo">
        <img src="assets/images/logo.png" alt="Meta Power Gym" class="brand-logo-img">
      </div>
      <h1 class="brand-title">METAPOWER GYM</h1>
      <p class="brand-sub">African Fitness Hardcore — Gestion</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <mat-form-field appearance="outline" class="full">
        <mat-label>Identifiant</mat-label>
        <input matInput formControlName="username" autocomplete="username">
        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Mot de passe</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password">
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      <p class="erreur" *ngIf="erreur">
        <i class="fas fa-circle-exclamation"></i> {{ erreur }}
      </p>

      <button mat-flat-button color="primary" class="full login-btn" type="submit"
              [disabled]="loading || form.invalid">
        <i class="fas" [class.fa-arrow-right-to-bracket]="!loading" [class.fa-spinner]="loading" [class.fa-spin]="loading"></i>
        {{ loading ? 'Connexion…' : 'Se connecter' }}
      </button>
    </form>

    <div class="login-footer">
      <span>v1.0 · Pilote — &copy; METAPOWER GYM</span>
    </div>
  </div>
</div>
