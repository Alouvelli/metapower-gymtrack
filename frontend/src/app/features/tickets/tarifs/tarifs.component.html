<div class="page-header">
  <div>
    <h1>Tarifs des tickets</h1>
    <p class="muted">Catalogue des passes vendus à la caisse</p>
  </div>
  <button mat-flat-button color="primary" (click)="nouveau()">
    <mat-icon>add</mat-icon> Nouveau tarif
  </button>
</div>

<div class="grid">
  <mat-card *ngFor="let t of tarifs" class="tarif-card" [class.disabled]="t.actif === false">
    <mat-icon>local_offer</mat-icon>
    <h3>{{ t.libelle }}</h3>
    <div class="prix">{{ t.prix }} FCFA</div>
    <div class="duree">Validité : {{ t.dureeValiditeHeures }}h</div>
    <div class="actions">
      <button mat-button color="primary" (click)="modifier(t)"><mat-icon>edit</mat-icon></button>
      <button mat-button color="warn" (click)="supprimer(t)"><mat-icon>delete</mat-icon></button>
    </div>
  </mat-card>
</div>

<mat-card class="form-card" *ngIf="edit">
  <h3>{{ edit.id ? 'Modifier' : 'Nouveau tarif' }}</h3>
  <form [formGroup]="form" (ngSubmit)="enregistrer()" class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Libellé</mat-label>
      <input matInput formControlName="libelle">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Prix (FCFA)</mat-label>
      <input matInput type="number" formControlName="prix">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Validité (heures)</mat-label>
      <input matInput type="number" formControlName="dureeValiditeHeures">
    </mat-form-field>
    <mat-checkbox formControlName="actif">Tarif actif</mat-checkbox>
    <div class="actions-row">
      <button mat-stroked-button type="button" (click)="edit = null">Annuler</button>
      <button mat-flat-button color="primary" type="submit">Enregistrer</button>
    </div>
  </form>
</mat-card>
