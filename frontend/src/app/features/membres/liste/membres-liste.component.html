<div class="page-header">
  <div>
    <h1>Membres</h1>
    <p class="muted">Gestion des adhérents et cartes QR</p>
  </div>
  <button mat-flat-button color="primary" routerLink="nouveau">
    <mat-icon>person_add</mat-icon> Nouveau membre
  </button>
</div>

<mat-card class="table-card">
  <div class="toolbar">
    <mat-form-field appearance="outline" class="search">
      <mat-label>Rechercher (nom, carte, téléphone…)</mat-label>
      <input matInput (keyup)="filtrer($any($event.target).value)">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <table mat-table [dataSource]="ds" matSort class="full">
    <ng-container matColumnDef="numeroCarte">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>N° carte</th>
      <td mat-cell *matCellDef="let m">{{ m.numeroCarte }}</td>
    </ng-container>
    <ng-container matColumnDef="nom">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom complet</th>
      <td mat-cell *matCellDef="let m">{{ m.nom }} {{ m.prenom }}</td>
    </ng-container>
    <ng-container matColumnDef="telephone">
      <th mat-header-cell *matHeaderCellDef>Téléphone</th>
      <td mat-cell *matCellDef="let m">{{ m.telephone }}</td>
    </ng-container>
    <ng-container matColumnDef="plan">
      <th mat-header-cell *matHeaderCellDef>Plan</th>
      <td mat-cell *matCellDef="let m">{{ m.planNom || '—' }}</td>
    </ng-container>
    <ng-container matColumnDef="statut">
      <th mat-header-cell *matHeaderCellDef>Statut</th>
      <td mat-cell *matCellDef="let m">
        <span class="badge" [ngClass]="badgeClass(m.statut)">{{ m.statut }}</span>
      </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="ta-right">Actions</th>
      <td mat-cell *matCellDef="let m" class="ta-right">
        <a mat-icon-button color="primary" [routerLink]="['/membres', m.id]" matTooltip="Détail">
          <mat-icon>visibility</mat-icon>
        </a>
        <a mat-icon-button [routerLink]="['/membres', m.id, 'modifier']" matTooltip="Modifier">
          <mat-icon>edit</mat-icon>
        </a>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayed"></tr>
    <tr mat-row *matRowDef="let row; columns: displayed;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[10, 25, 50]" pageSize="10" showFirstLastButtons></mat-paginator>
  <div class="loading" *ngIf="loading"><mat-spinner diameter="36"></mat-spinner></div>
</mat-card>
