<div class="membre-form-wrapper">

  <!-- ══════════ HERO ══════════ -->
  <div class="form-hero">
    <div class="hero-deco"></div>
    <div class="hero-content">
      <div class="hero-left">
        <div class="hero-icon-wrap">
          <i [class]="id ? 'fas fa-user-pen' : 'fas fa-user-plus'"></i>
        </div>
        <div class="hero-text">
          <h1>{{ id ? 'Modifier le membre' : 'Nouveau membre' }}</h1>
          <p>{{ id ? 'Mise à jour du dossier adhérent' : 'Créer un nouvel adhérent dans le système' }}</p>
        </div>
      </div>
      <a class="btn-back" routerLink="/membres">
        <i class="fas fa-arrow-left"></i>
        <span>Retour à la liste</span>
      </a>
    </div>
  </div>

  <!-- ══════════ BODY ══════════ -->
  <div class="form-body">
    <div class="form-card">

      <div class="form-card-header">
        <div class="form-card-icon">
          <i [class]="id ? 'fas fa-user-pen' : 'fas fa-user'"></i>
        </div>
        <div>
          <h3>Informations du membre</h3>
          <p>Renseignez les coordonnées et le plan d'abonnement</p>
        </div>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="site-form">

        <div class="form-row-2">
          <div class="form-field">
            <label>Nom <span class="req">*</span></label>
            <div class="field-wrap">
              <i class="fas fa-user field-ico"></i>
              <input formControlName="nom" placeholder="Ex : DIALLO">
            </div>
          </div>
          <div class="form-field">
            <label>Prénom <span class="req">*</span></label>
            <div class="field-wrap">
              <i class="fas fa-user field-ico"></i>
              <input formControlName="prenom" placeholder="Ex : Mamadou">
            </div>
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-field">
            <label>Téléphone <span class="req">*</span></label>
            <div class="field-wrap">
              <i class="fas fa-phone field-ico"></i>
              <input formControlName="telephone" placeholder="Ex : +221 77 000 00 00">
            </div>
          </div>
          <div class="form-field">
            <label>Email <span class="opt">(optionnel)</span></label>
            <div class="field-wrap">
              <i class="fas fa-envelope field-ico"></i>
              <input formControlName="email" type="email" placeholder="Ex : membre@email.com">
            </div>
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-field">
            <label>Date de naissance <span class="opt">(optionnel)</span></label>
            <div class="field-wrap">
              <i class="fas fa-cake-candles field-ico"></i>
              <input formControlName="dateNaissance" type="date">
            </div>
          </div>
          <div class="form-field">
            <label>Plan d'abonnement <span class="opt">(optionnel)</span></label>
            <div class="field-wrap">
              <i class="fas fa-medal field-ico"></i>
              <select formControlName="planId" class="field-select">
                <option [ngValue]="null">— Sans plan —</option>
                <option *ngFor="let p of plans" [ngValue]="p.id">
                  {{ p.nom }} — {{ p.prix | number }} FCFA / {{ p.dureeEnMois }} mois
                </option>
              </select>
              <i class="fas fa-chevron-down select-arrow"></i>
            </div>
          </div>
        </div>

        <div class="form-footer">
          <a class="btn-cancel" routerLink="/membres">
            <i class="fas fa-times"></i> Annuler
          </a>
          <button type="submit" class="btn-save" [disabled]="loading || form.invalid">
            <span class="btn-spinner" *ngIf="loading"></span>
            <i class="fas fa-check" *ngIf="!loading"></i>
            {{ id ? 'Enregistrer les modifications' : 'Créer le membre' }}
          </button>
        </div>

      </form>
    </div>
  </div>

</div>
