<div class="page-header">
  <a mat-icon-button routerLink="/membres"><mat-icon>arrow_back</mat-icon></a>
  <h1>{{ id ? 'Modifier le membre' : 'Nouveau membre' }}</h1>
</div>

<mat-card class="form-card">
  <form [formGroup]="form" (ngSubmit)="submit()" class="grid">
    <mat-form-field appearance="outline">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="nom">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Prénom</mat-label>
      <input matInput formControlName="prenom">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Téléphone</mat-label>
      <input matInput formControlName="telephone">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Date de naissance</mat-label>
      <input matInput type="date" formControlName="dateNaissance">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Plan d'abonnement</mat-label>
      <mat-select formControlName="planId">
        <mat-option *ngFor="let p of plans" [value]="p.id">
          {{ p.nom }} — {{ p.prix }} FCFA / {{ p.dureeEnMois }} mois
        </mat-option>
      </mat-select>
    </mat-form-field>

    <div class="actions">
      <button mat-stroked-button type="button" routerLink="/membres">Annuler</button>
      <button mat-flat-button color="primary" type="submit" [disabled]="loading || form.invalid">
        <mat-icon>save</mat-icon> Enregistrer
      </button>
    </div>
  </form>
</mat-card>
