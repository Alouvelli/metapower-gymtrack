<mat-sidenav-container class="layout">
  <mat-sidenav mode="side" opened class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <i class="fas fa-dumbbell"></i>
      </div>
      <div class="brand-text">
        <div class="brand-title">METAPOWER</div>
        <div class="brand-sub">GymTrack</div>
      </div>
    </div>

    <nav class="nav-list">
      <a *ngFor="let item of nav; let i = index"
         class="nav-link"
         [routerLink]="item.route"
         routerLinkActive="active"
         [style.animation-delay.s]="i * 0.05">
        <span class="nav-icon"><i [class]="item.icon"></i></span>
        <span class="nav-label">{{ item.label }}</span>
        <span class="nav-indicator"></span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="version-tag">v1.0 · Pilote</div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">Gestion centralisée multisite</span>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn" matTooltip="Notifications">
          <i class="fas fa-bell"></i>
          <span class="topbar-dot"></span>
        </button>
        <button class="user-btn" [matMenuTriggerFor]="menu">
          <span class="user-avatar">A</span>
          <span class="user-name">Admin</span>
          <i class="fas fa-chevron-down"></i>
        </button>
        <mat-menu #menu="matMenu" xPosition="before">
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon><span>Déconnexion</span>
          </button>
        </mat-menu>
      </div>
    </div>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
