server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aligné sur spring.servlet.multipart.max-request-size (photos membres)
    client_max_body_size 10m;

    # DNS interne Docker : ré-résout "backend" à chaque requête, sinon nginx
    # garde l'IP du démarrage et renvoie 502 après un redémarrage du backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    # Paramètres proxy communs (hérités par les locations ci-dessous)
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # ^~ : prioritaire sur la regex des assets statiques (ex. /files/view/photo.jpg)
    location ^~ /api/ {
        proxy_pass $backend_upstream;
    }

    location ^~ /auth/ {
        proxy_pass $backend_upstream;
    }

    location ^~ /files/ {
        proxy_pass $backend_upstream;
    }

    # Angular SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache des assets statiques
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
