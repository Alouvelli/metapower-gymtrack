spring:
  application:
    name: gymtrack
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymtrack_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  # Aucune valeur par défaut pour les secrets : sans variable d'environnement,
  # l'appli refuse de démarrer (les anciennes valeurs sont publiques sur GitHub)
  secret-key: ${JWT_SECRET}
  expiration-hours: 8

app:
  base-url: ${APP_BASE_URL:http://localhost:4200}
  device-access-key: ${DEVICE_ACCESS_KEY}
  admin-default-password: ${ADMIN_DEFAULT_PASSWORD}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    sn.metapower.gymtrack: INFO
    org.springframework.security: INFO
